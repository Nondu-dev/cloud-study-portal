<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStudy | Student Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CloudStudy</h1>
        <p>Your student notes, organised in one place.</p>
        <p id="apiStatus">Checking cloud connection...</p>
    </header>

    <main>
        <section class="note-form">
            <h2>Add a Study Note</h2>

            <form id="noteForm">
                <label for="subject">Subject</label>
                <input id="subject" type="text" required
                       placeholder="e.g. Cloud Computing">

                <label for="title">Note Title</label>
                <input id="title" type="text" required
                       placeholder="e.g. Introduction to AWS">

                <label for="content">Note Content</label>
                <textarea id="content" required
                          placeholder="Write your study notes here"></textarea>

                <button type="submit">Add Note</button>
            </form>
        </section>

        <section class="document-section">
            <h2>Upload a Study Document</h2>

            <form id="documentForm">
                <label for="studyDocument">
                    Choose a document (PDF, TXT or DOCX)
                </label>

                <input
                    id="studyDocument"
                    type="file"
                    accept=".pdf,.txt,.docx"
                    required
                >

                <button type="submit">Upload Document</button>

                <p id="uploadStatus" role="status"></p>
            </form>
        </section>

        <section class="notes-section">
            <h2>My Study Notes</h2>
            <p id="emptyMessage">Your notes will appear here.</p>
            <div id="notesList"></div>
        </section>
    </main>

    <footer>
        <p>CloudStudy | Cloud Computing Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
